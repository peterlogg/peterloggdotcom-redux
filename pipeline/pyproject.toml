[project]
name = "akka"
version = "0.1.0"
description = "Extract and analyse the weekly akka accumulator from WhatsApp history"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scipy>=1.13",
    "requests>=2.32",
    "pydantic>=2.9",
    "langchain-core>=1.7",
    "langchain-anthropic>=1.7",
    "typesafe-sdk",
]

[project.scripts]
akka = "akka.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
